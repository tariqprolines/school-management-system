services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: sms_password
      POSTGRES_DB: sms_db
    ports:
      - "5433:5432"
    volumes:
      - sms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d sms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sms_user:sms_password@db:5432/sms_db
      SECRET_KEY: dev-secret-key-change-in-production
      API_ACCESS_TOKEN: dev-api-access-token
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_API_ACCESS_TOKEN: dev-api-access-token
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  sms_postgres_data:
