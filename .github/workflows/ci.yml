name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DATABASE_URL: postgresql+asyncpg://sms_user:sms_password@localhost:5432/sms_test_db
  SECRET_KEY: ci-test-secret-key
  API_ACCESS_TOKEN: ci-test-api-access-token
  CORS_ORIGINS: http://localhost:5173

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sms_user
          POSTGRES_PASSWORD: sms_password
          POSTGRES_DB: sms_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms_user -d sms_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Build
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_API_ACCESS_TOKEN: ci-test-api-access-token
        run: npm run build
