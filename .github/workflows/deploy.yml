name: Deploy App

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DATABASE_URL: postgresql+asyncpg://sms_user:sms_password@127.0.0.1:5432/sms_test_db
  SECRET_KEY: ci-test-secret-key
  API_ACCESS_TOKEN: ci-test-api-access-token
  CORS_ORIGINS: http://localhost:5173

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: bash .github/scripts/setup-postgres.sh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest tests/ -v --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_API_ACCESS_TOKEN: ci-test-api-access-token
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_ACCESS_TOKEN: ${{ vars.VITE_API_ACCESS_TOKEN }}
        run: |
          npm ci
          npm run build
          rm -rf node_modules

      - name: Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend,infra/ec2,frontend"
          target: "/tmp/sms-staging"

      - name: Install and restart on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
          VITE_API_ACCESS_TOKEN: ${{ vars.VITE_API_ACCESS_TOKEN }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,SECRET_KEY,API_ACCESS_TOKEN,VITE_API_ACCESS_TOKEN,CORS_ORIGINS,VITE_API_URL
          command_timeout: 20m
          script: bash /tmp/sms-staging/infra/ec2/deploy.sh
