# Frontend + API on one EC2 instance.
# Static files: /var/www/html/school-management-system/frontend/dist
# API:         /var/www/html/school-management-system/backend (uvicorn :8000)

server {
    listen 80;
    server_name _;

    root /var/www/html/school-management-system/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
